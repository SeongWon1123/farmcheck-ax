[unix_http_server]
file=/data/hackathon/farmcheck/run/supervisor.sock
chmod=0700

[supervisord]
logfile=/data/hackathon/farmcheck/run/supervisord.log
pidfile=/data/hackathon/farmcheck/run/supervisord.pid
childlogdir=/data/hackathon/farmcheck/run
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///data/hackathon/farmcheck/run/supervisor.sock

[program:farmcheck]
directory=/data/hackathon/farmcheck/app
command=/data/hackathon/farmcheck/app/.venv/bin/uvicorn farmcheck.app:app --host 0.0.0.0 --port 8501
environment=FARM_DATA_MODE="synthetic",FARM_DB_PATH="/data/hackathon/farmcheck/var/synthetic.sqlite",APP_BASE_PATH="/i/SpPClk4QcdJwast1",APP_ROUTE_PREFIX="/i/SpPClk4QcdJwast1",FARM_COOKIE_SECURE="1"
autostart=true
autorestart=unexpected
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/data/hackathon/farmcheck/run/app.log
stderr_logfile=/data/hackathon/farmcheck/run/app-error.log
